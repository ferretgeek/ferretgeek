name: Refresh activity cards

on:
  schedule:
    - cron: '23 18 * * *'  # 02:23 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Render cards from live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stats.py

      - name: Commit when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats
          if git diff --cached --quiet; then
            echo 'Stats unchanged.'
            exit 0
          fi
          git commit -m 'chore(stats): refresh activity cards'
          git push
