<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title description">
  <title id="title">Ferret capability map</title>
  <desc id="description">从产品体验、全栈与桌面开发，到运维交付的双语能力地图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1b2b"/>
      <stop offset="1" stop-color="#14122a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#cbd5e1" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="600" rx="30" fill="url(#bg)"/>
  <rect width="1280" height="600" rx="30" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="598" rx="29" fill="none" stroke="#bae6fd" stroke-opacity="0.12" stroke-width="2"/>

  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <text x="64" y="70" fill="#7dd3fc" font-size="18" font-weight="650" letter-spacing="1.5">CAPABILITY MAP · 能力地图</text>
    <text x="64" y="112" fill="#f8fafc" font-size="30" font-weight="750">从想清楚，到做出来，再到稳定交付。</text>
    <text x="664" y="109" fill="#9fb3c8" font-size="21">From product clarity to dependable delivery.</text>

    <g filter="url(#shadow)">
      <rect x="64" y="152" width="352" height="304" rx="20" fill="#0b2130" stroke="#2dd4bf" stroke-opacity="0.34"/>
      <rect x="464" y="152" width="352" height="304" rx="20" fill="#0c1d32" stroke="#38bdf8" stroke-opacity="0.34"/>
      <rect x="864" y="152" width="352" height="304" rx="20" fill="#151a31" stroke="#c084fc" stroke-opacity="0.34"/>
    </g>

    <circle cx="100" cy="194" r="15" fill="#2dd4bf"/>
    <text x="128" y="202" fill="#ecfeff" font-size="22" font-weight="720">产品与体验 / Product &amp; UX</text>
    <text x="96" y="250" fill="#cbd5e1" font-size="17">信息架构与复杂流程梳理</text>
    <text x="96" y="278" fill="#8296aa" font-size="15">Information architecture &amp; complex flows</text>
    <text x="96" y="326" fill="#cbd5e1" font-size="17">响应式深浅色界面与可访问性</text>
    <text x="96" y="354" fill="#8296aa" font-size="15">Responsive themes &amp; accessibility</text>
    <rect x="96" y="393" width="230" height="34" rx="9" fill="#123743"/>
    <text x="112" y="416" fill="#99f6e4" font-size="14" font-weight="650">CPA-X · QUOTA OVERVIEW</text>

    <circle cx="500" cy="194" r="15" fill="#38bdf8"/>
    <text x="528" y="202" fill="#eff6ff" font-size="22" font-weight="720">全栈与桌面 / Build</text>
    <text x="496" y="250" fill="#cbd5e1" font-size="17">Python / Flask · Go / React</text>
    <text x="496" y="278" fill="#8296aa" font-size="15">Services, dashboards &amp; local tools</text>
    <text x="496" y="326" fill="#cbd5e1" font-size="17">C# / WPF · TypeScript</text>
    <text x="496" y="354" fill="#8296aa" font-size="15">Windows desktop &amp; web experience</text>
    <rect x="496" y="393" width="192" height="34" rx="9" fill="#123047"/>
    <text x="512" y="416" fill="#bae6fd" font-size="14" font-weight="650">CODEX ORBIT · CPA-X</text>

    <circle cx="900" cy="194" r="15" fill="#c084fc"/>
    <text x="928" y="202" fill="#faf5ff" font-size="22" font-weight="720">运维与交付 / Ship</text>
    <text x="896" y="250" fill="#cbd5e1" font-size="17">Docker / systemd · CI / Release</text>
    <text x="896" y="278" fill="#8296aa" font-size="15">Packaging, verification &amp; automation</text>
    <text x="896" y="326" fill="#cbd5e1" font-size="17">健康检查、回滚与可执行文档</text>
    <text x="896" y="354" fill="#8296aa" font-size="15">Health checks, rollback &amp; agent-ready docs</text>
    <rect x="896" y="393" width="208" height="34" rx="9" fill="#2a2341"/>
    <text x="912" y="416" fill="#e9d5ff" font-size="14" font-weight="650">ALL PUBLIC PRODUCTS</text>

    <path d="M82 522H1198" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <g fill="#e2e8f0" font-size="14" font-weight="650" text-anchor="middle">
      <circle cx="100" cy="522" r="7" fill="#2dd4bf"/><text x="100" y="554">理解 / DISCOVER</text>
      <circle cx="370" cy="522" r="7" fill="#22d3ee"/><text x="370" y="554">设计 / DESIGN</text>
      <circle cx="640" cy="522" r="7" fill="#38bdf8"/><text x="640" y="554">开发 / BUILD</text>
      <circle cx="910" cy="522" r="7" fill="#818cf8"/><text x="910" y="554">验证 / VERIFY</text>
      <circle cx="1180" cy="522" r="7" fill="#c084fc"/><text x="1180" y="554">交付 / SHIP</text>
    </g>
  </g>
</svg>
